name: Set up Node and the npm dependencies
description: >-
  Node from .node-version, then the npm dependencies without install scripts.
  The one place that pins actions/setup-node. The caller checks the repository
  out first (a local action needs the files).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Install dependencies without install scripts
      shell: bash
      env:
        IBM_TELEMETRY_DISABLED: 'true'
      run: npm ci --ignore-scripts
