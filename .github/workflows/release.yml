name: Release

# Releases the version in package.json from main, started by hand (Actions →
# Release → Run workflow on main). The workflow creates the tag v<version> on
# the built commit together with the GitHub release. See "Releasing" in
# README.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack, but attest nothing and create no tag or release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Runs the npm dependencies, so it gets read access only.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # A run from any other ref fails here, red, before anything else runs.
      - name: Started on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release.yml runs only on main, not on '$GITHUB_REF'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the previous release in the notes
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version="$(jq -r .version package.json)"
          tag="v$version"
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::package.json version '$version' does not match X.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Also stops a re-run of a finished release before anything is attested.
      - name: Tag and release do not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          refs="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$refs" ]; then
            echo "::error::tag $TAG exists; bump version in package.json"
            exit 1
          fi
          if out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            echo "::error::release $TAG exists; bump version in package.json"
            exit 1
          fi
          if [ "$out" != "release not found" ]; then
            echo "::error::could not check for release $TAG: $out"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::npm run build changed the tree"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Package contents
        run: npm pack --dry-run --json --ignore-scripts | node scripts/check-pack.mjs

      - name: Pack
        id: pack
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          npm pack --ignore-scripts --pack-destination "$dist"
          tarball="pklnx-design-system-${TAG#v}.tgz"
          found="$(ls -A "$dist")"
          if [ "$found" != "$tarball" ]; then
            echo "::error::expected only $tarball in the pack destination, found: $found"
            exit 1
          fi
          (cd "$dist" && sha256sum "$tarball" > SHA256SUMS)
          node scripts/release-notes.mjs "$TAG" "$dist/$tarball" > "$dist/notes.md"
          cat "$dist/SHA256SUMS"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          {
            echo "# $TAG from $GITHUB_SHA"
            echo
            cat "$dist/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tree still clean
        run: test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # Signs the tarball. Runs no repository or dependency code.
  attest:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.tarball }}

  # Creates the tag and the release. Runs no repository or dependency code.
  release:
    needs: [build, attest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Creates the tag on the built commit ($GITHUB_SHA) through the API.
      # Creating a ref fails when it exists, so a tag pushed since the build
      # job's check is never reused.
      - name: Create the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$TAG" =~ $re ]] || [ "$TARBALL" != "pklnx-design-system-${TAG#v}.tgz" ]; then
            echo "::error::unexpected tag '$TAG' or tarball '$TARBALL' from the build job"
            exit 1
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent; then
            echo "::error::could not create tag $TAG on $GITHUB_SHA; does it exist?"
            exit 1
          fi

      # The release on the tag of the previous step (--verify-tag: gh never
      # creates one). gh fails if the release exists, so published assets are
      # never replaced.
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            "$TARBALL" SHA256SUMS

      # Removes the tag this run created, and the draft gh leaves when an
      # upload fails, so the next run can start over. A published release
      # and its tag stay.
      - name: Remove the tag after a failed release
        if: failure() && steps.tag.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            if [ "$out" != "true" ]; then
              echo "::error::release $TAG is published although a step failed; check it, the tag stays"
              exit 1
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          elif [ "$out" != "release not found" ]; then
            echo "::error::could not check for release $TAG: $out; delete tag $TAG by hand if no release uses it"
            exit 1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --silent
          echo "::notice::removed tag $TAG; fix the failure and run the workflow again"
