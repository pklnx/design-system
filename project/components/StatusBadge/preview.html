<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusBadge</title>
<style>body{margin:0;background:var(--background);color:var(--text-primary)}.row{display:flex;flex-wrap:wrap;gap:32px;align-items:center;padding:32px}</style></head>
<body>
<div id="root" class="row"></div>
<script>
var P = window.Pklnx, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(P.StatusBadge, { status: 'ok' }),
  h(P.StatusBadge, { status: 'warn' }, 'Maintenance until 6 pm'),
  h(P.StatusBadge, { status: 'err' }),
  h(P.StatusBadge, { status: 'info' }),
  h(P.StatusBadge, { status: 'off' })
));
</script>
</body>
</html>
