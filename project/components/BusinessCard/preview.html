<!-- @dsCard group="Geschäftsausstattung" height=420 width=1120 subtitle="Visitenkarte 85 × 55 mm, Vorder- und Rückseite" page -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Visitenkarte</title>
<style>
body{margin:0;background:var(--background);font-family:var(--font-sans)}
.desk{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;padding:40px 24px;background:var(--layer-01)}
.card{position:relative;width:482px;height:312px;overflow:hidden;box-shadow:0 0 0 1px var(--border-subtle-00)}
.front{background:var(--background)}
.front svg.pat{position:absolute;inset:0;width:100%;height:100%}
.ln{fill:var(--border-subtle-00)} .st{fill:var(--star)}
.front .mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px;background:var(--background);color:var(--text-primary)}
.back{background:var(--background);color:var(--text-primary)}
.back .wm{position:absolute;left:34px;top:34px;color:var(--text-primary)}
.back .who{position:absolute;left:40px;bottom:96px}
.name{font-weight:600;font-size:18px;line-height:24px}
.role{font-size:13px;line-height:18px;color:var(--text-secondary)}
.back .ct{position:absolute;left:40px;bottom:34px;font-family:var(--font-mono);font-size:12px;line-height:18px;color:var(--text-secondary)}
.back .ct b{color:var(--link-primary);font-weight:400}
</style></head>
<body>
<div class="desk">
  <div class="card front" data-theme="dark" aria-label="Vorderseite">
    <svg class="pat" aria-hidden="true"><defs><pattern id="bc" width="96" height="96" patternUnits="userSpaceOnUse">
      <g transform="translate(8 8) scale(0.5)"><path class="ln" d="M5.5 24.5 L5.5 51.5 L58.5 51.5 L58.5 24.5 L51.5 24.5 L51.5 44.5 L12.5 44.5 L12.5 24.5 Z"/><path class="ln" d="M30.2 13 L33.8 13 L37.1 22.9 L47 26.2 L47 29.8 L37.1 33.1 L33.8 43 L30.2 43 L26.9 33.1 L17 29.8 L17 26.2 L26.9 22.9 Z"/></g>
      <g transform="translate(56 56) scale(0.5)"><path class="ln" d="M5.5 24.5 L5.5 51.5 L58.5 51.5 L58.5 24.5 L51.5 24.5 L51.5 44.5 L12.5 44.5 L12.5 24.5 Z"/></g>
      <g transform="translate(64 12) scale(0.25)"><path class="st" d="M30.2 13 L33.8 13 L37.1 22.9 L47 26.2 L47 29.8 L37.1 33.1 L33.8 43 L30.2 43 L26.9 33.1 L17 29.8 L17 26.2 L26.9 22.9 Z"/></g>
    </pattern></defs><rect width="100%" height="100%" fill="url(#bc)"/></svg>
    <div class="mk" data-logo="mark" data-h="96"></div>
  </div>
  <div class="card back" data-theme="light" aria-label="Rückseite">
    <div class="wm" data-logo="wordmark" data-h="30"></div>
    <div class="who"><div class="name">Patrick Klein</div><div class="role">Infrastructure &amp; Cloud Engineering</div></div>
    <div class="ct">[mail]@pklnx.space<br>[Telefon]<br><b>pklnx.space</b></div>
  </div>
</div>
<script>
document.querySelectorAll('[data-logo]').forEach(function (el) {
  ReactDOM.createRoot(el).render(React.createElement(window.Pklnx.Logo, { variant: el.getAttribute('data-logo'), height: +el.getAttribute('data-h'), mono: el.hasAttribute('data-mono') }));
});
</script>
</body>
</html>
